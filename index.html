<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Google TV (an Android WebView) otherwise lays the page out at 1280x720 and shows it zoomed
     out to 1488x837: the page filled only the top-left ~86 % of the screen. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NowPlaying</title>
<!-- The Cast receiver framework (Google's): gives us the channel the PC's app talks on. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --tint: #7a9cff; --head: 0px; }
  /* body clips (and is what fill() scales); html must not, or the scaled page is cut at the old size */
  html { background: #07070a; }
  html, body { margin: 0; height: 100%; background: #07070a; color: #fff;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { overflow: hidden; position: relative; }
  /* The living cover: a small, pre-blurred copy of the cover stretched far past the screen,
     drifting, zooming and turning on slow waves, with three colour clouds from it floating over.
     Only transforms change per frame: cheap for the TV's GPU. Two layers, so a new cover fades in. */
  .bg { position: absolute; left: -20%; top: -20%; width: 140%; height: 140%; opacity: 0;
    transition: opacity 1.6s ease; will-change: transform, opacity; }
  .bg.on { opacity: 1; }
  .blob { position: absolute; width: 70vw; height: 70vw; border-radius: 50%; left: 15vw; top: -10vw;
    opacity: 0; transition: opacity 2s ease, background 2s ease; mix-blend-mode: screen; will-change: transform; }
  .blob.on { opacity: 0.32; }
  #veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, rgba(0,0,0,0.12), rgba(0,0,0,0.62) 78%); }
  #stage { position: absolute; inset: 0; display: grid; grid-template-columns: 38% 62%; align-items: center; }
  /* Left: the sharp cover, its title and the time. */
  #left { display: flex; flex-direction: column; align-items: flex-start; padding-left: 7vw; }
  /* The cover's frame: a new track's picture rises in from below while the old one leaves over
     the top -- moved, never faded (a fade looked cheap). The frame clips them. */
  #covers { position: relative; width: 26vw; height: 26vw; border-radius: 1.2vw; overflow: hidden;
    box-shadow: 0 2.5vw 6vw rgba(0,0,0,0.55); background: #222; }
  .cov { position: absolute; inset: 0; background: #222 center/cover no-repeat; will-change: transform; }
  .cov.anim { transition: transform 0.7s cubic-bezier(.3,.7,.2,1); }
  .words { transition: opacity 0.28s ease, transform 0.45s cubic-bezier(.2,.8,.2,1); }
  .words.out { opacity: 0; transform: translateY(-0.8vw); }
  .words.pre { opacity: 0; transform: translateY(1vw); transition: none; }
  /* A long title or artist gets smaller rather than cut (fitText), and at the smallest wraps to
     a second line. */
  #title { font-size: 3.1vw; font-weight: 700; margin-top: 2.6vw; width: 28vw; line-height: 1.12; white-space: nowrap; }
  #artist { font-size: 1.9vw; opacity: 0.72; margin-top: 0.5vw; width: 28vw; line-height: 1.2; white-space: nowrap; }
  #title.wrap, #artist.wrap { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  #title.wrap { -webkit-line-clamp: 3; }
  #artist.wrap { -webkit-line-clamp: 2; }
  #from { font-size: 0.95vw; letter-spacing: 0.25em; text-transform: uppercase; opacity: 0.5; margin-bottom: 1.2vw; min-height: 1.2vw; line-height: 1.2vw; }
  #strip { width: 26vw; height: 3vw; margin-top: 1.6vw; display: block; }
  #times { width: 26vw; display: flex; justify-content: space-between; font-size: 0.95vw; opacity: 0.6; margin-top: 0.4vw; }
  /* Right: the lyrics, the sung line bright and a third down; or the list, or the artist. */
  /* its right margin as the cover's left one (7vw) */
  #right { height: 100vh; position: relative; overflow: hidden; margin-right: 7vw; }
  #lyr { position: absolute; left: 0; right: 0; top: 10vh; bottom: 10vh;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 78%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 78%, transparent 100%);
    transition: opacity 0.5s ease; }
  #lines { position: absolute; left: 0; right: 0; top: 0; transition: transform 0.55s cubic-bezier(.25,.8,.25,1); }
  .line { font-size: 2.6vw; font-weight: 700; line-height: 1.25; padding: 0.55vw 0; opacity: 0.28;
    transition: opacity 0.4s, color 0.4s, filter 0.4s; filter: blur(0.06vw); }
  .line.now { opacity: 1; filter: none; }
  .line.near { opacity: 0.5; filter: none; }
  .line .rom { display: block; font-size: 0.55em; font-weight: 400; opacity: 0.75; margin-top: 0.2vw; }
  /* Karaoke, as the full screen: each word fills with the sung colour as it is sung (--p), the
     part not yet sung a dim white; sung words stay coloured. */
  .line.now .w { background-image: linear-gradient(90deg, var(--sung, #fff) calc(var(--p, 0%) - 8%), rgba(255,255,255,0.41) var(--p, 0%));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* The list and the artist start level with "playing from" on the left (--head). */
  #list, #art { position: absolute; left: 0; right: 0; top: var(--head); bottom: 0; transition: opacity 0.5s ease; }
  .empty { font-size: 1.5vw; opacity: 0.6; max-width: 40vw; line-height: 1.5; }
  .cap { font-size: 0.95vw; letter-spacing: 0.25em; opacity: 0.55; line-height: 1.2vw; margin-bottom: 1.4vw; text-transform: uppercase; }
  .nx { display: flex; align-items: center; margin-bottom: 1.1vw; }
  .nx .a { width: 4.4vw; height: 4.4vw; border-radius: 0.5vw; background: rgba(255,255,255,0.1) center/cover no-repeat; flex: none; }
  .nx .t { margin-left: 1.2vw; min-width: 0; }
  .nx .t b { display: block; font-size: 1.6vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nx .t span { display: block; font-size: 1.1vw; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nx.now .t b { color: var(--sung, #fff); }
  .nx.now .a, .cell.now .a { box-shadow: 0 0 0 0.25vw var(--sung, #fff); }
  /* minmax(0, 1fr): a plain 1fr is at least as wide as a cell's longest title (no wrap), and one
     long title made its column twice as wide and pushed the last off the screen. */
  #items.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1.4vw 1.2vw; }
  .cell { min-width: 0; }
  .cell .a { width: 100%; padding-top: 100%; border-radius: 0.6vw; background: rgba(255,255,255,0.1) center/cover no-repeat; }
  .cell b { display: block; font-size: 0.95vw; margin-top: 0.5vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell span { display: block; font-size: 0.8vw; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #art .top { display: flex; align-items: center; gap: 2vw; }
  #art .pic { width: 12vw; height: 12vw; border-radius: 50%; background: rgba(255,255,255,0.1) center/cover no-repeat; flex: none; box-shadow: 0 1.5vw 4vw rgba(0,0,0,0.5); }
  #art .name { font-size: 3vw; font-weight: 700; line-height: 1.1; }
  #art .facts { font-size: 1.2vw; opacity: 0.7; margin-top: 0.6vw; }
  #art .tags { font-size: 1vw; opacity: 0.55; margin-top: 0.4vw; letter-spacing: 0.05em; }
  #art .bio { font-size: 1.35vw; line-height: 1.55; opacity: 0.85; margin-top: 2.4vw; max-width: 50vw;
    display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; }
  #idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 2vw; letter-spacing: 0.4em; opacity: 0.5; }
  .hidden { display: none !important; }
  .gone { visibility: hidden; }
  .faded { opacity: 0; }
  /* Whose music it is: the player's mark and name, top left. */
  #badge { position: absolute; left: 4vw; top: 5vh; display: flex; align-items: center; gap: 0.8vw;
    font-size: 1.05vw; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.75; }
  #badge img { width: 2.2vw; height: 2.2vw; object-fit: contain; filter: drop-shadow(0 0.2vw 0.4vw rgba(0,0,0,0.5)); }
  /* The clock, top right. */
  /* The clock, top right: the player's name's size and look, level with it. */
  #clock { position: absolute; right: 4vw; top: 5vh; height: 2.2vw; line-height: 2.2vw; font-size: 1.05vw; letter-spacing: 0.18em; opacity: 0.75; }
  /* What comes next, in the corner in a song's last 20 s (while the lyrics show). */
  #corner { position: absolute; right: 4vw; bottom: 6vh; display: flex; align-items: center; gap: 1vw;
    padding: 0.9vw 1.4vw 0.9vw 0.9vw; border-radius: 1vw; background: rgba(0,0,0,0.38);
    transform: translateY(14vh); opacity: 0; transition: transform 0.6s cubic-bezier(.2,.8,.2,1), opacity 0.5s; max-width: 30vw; }
  #corner.on { transform: none; opacity: 1; }
  #corner .a { width: 4vw; height: 4vw; border-radius: 0.5vw; background: rgba(255,255,255,0.1) center/cover no-repeat; flex: none; }
  #corner .h { font-size: 0.8vw; letter-spacing: 0.3em; opacity: 0.6; }
  #corner b { display: block; font-size: 1.3vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #corner span { display: block; font-size: 1vw; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #corner .t { min-width: 0; }
</style>
</head>
<body>
<canvas class="bg" id="bgA" width="320" height="180"></canvas><canvas class="bg" id="bgB" width="320" height="180"></canvas>
<div class="blob" id="b0"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div>
<div id="veil"></div>
<div id="stage" class="hidden">
  <div id="left">
    <div id="from" class="words"></div>
    <div id="covers"><div class="cov" id="covA"></div><div class="cov" id="covB" style="transform: translateY(100%)"></div></div>
    <div id="title" class="words"></div>
    <div id="artist" class="words"></div>
    <canvas id="strip" width="520" height="60"></canvas>
    <div id="times"><span id="el">0:00</span><span id="left_">0:00</span></div>
  </div>
  <div id="right">
    <div id="lyr" class="hidden"><div id="lines"></div></div>
    <div id="list" class="hidden"><div class="cap" id="listCap">UP NEXT</div><div id="items"></div></div>
    <div id="art" class="hidden"><div class="top"><div class="pic"></div><div><div class="name"></div><div class="facts"></div><div class="tags"></div></div></div><div class="bio"></div></div>
  </div>
</div>
<div id="badge" class="hidden"><img id="logo" alt=""><span id="appname"></span></div>
<div id="clock" class="hidden"></div>
<div id="corner"><div class="a"></div><div class="t"><div class="h">UP NEXT</div><b></b><span></span></div></div>
<div id="idle">NOWPLAYING</div>
<script>
/*
 * NowPlaying on the TV. The PC's app (NowPlaying, Windows) connects to this receiver and sends
 * JSON on the namespace below, in parts, each when it changes (2.34.0):
 *   state  { key, title, artist, from, tint, sung, vis (the visualiser's colour), pos (ms), len (ms), playing, opts }
 *          opts: { right: 0 lyrics else the list | 1 lyrics | 2 the list | 3 lyrics else the artist,
 *                  list: 0 up next | 1 playlist, grid, strip: 0 waveform | 1 visualiser | 2 line, white,
 *                  corner, logo, from, bar, clock, calm }
 *   art    { key, art (https or data: URL) }        logo { app, logo (data: URL) }
 *   lines  { key, lines: [{ t, x, w: [{ t, x }]?, r (romanised)? }] | null }
 *   list   { mode: 0 up next | 1 playlist, at (the playing one's index, playlist), items: [{ title, artist, art }] }
 *   artist { name, pic (data: URL), bio, facts, tags, listeners }
 *   wave   { key, w: [160 x 0..100] }               bands { b: [32 x 0..99] } (~15 a second)
 * Between messages the position runs on here, so the lyrics and the time move smoothly.
 */
const NS = 'urn:x-cast:app.nowplaying';
const $ = id => document.getElementById(id);
let st = null, at = 0, cur = -2, opts = {}, artNow = null, bgFront = 'bgA', shownKey = null, covFront = 'covA';
let linesMsg = null, listMsg = null, artistMsg = null, wave = null, waveKey = null, bands = null, bandsAt = 0;
let rightSig = null, appNow = '', shownBands = null, capsAt = null, capsHold = null, px1 = 1;

function fmt(ms) { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function opt(k, dflt) { return opts[k] === undefined ? dflt : opts[k]; }

function onMessage(m) {
  switch (m.type) {
    case 'state': state(m); break;
    case 'art': cover(m); break;
    case 'logo':
      if (m.logo && $('logo').src !== m.logo) $('logo').src = m.logo;
      $('logo').classList.toggle('hidden', !m.logo);
      $('appname').textContent = m.app || ''; appNow = m.app || '';
      $('badge').dataset.has = (m.logo || m.app) ? '1' : '';
      badge();
      break;
    case 'lines': linesMsg = m; right(); break;
    case 'list': listMsg = m; right(); corner(); break;
    case 'artist': artistMsg = m; right(); break;
    case 'wave': wave = m.w; waveKey = m.key; break;
    case 'bands': vis.b = m.b; vis.l = m.l || null; vis.r = m.r || null; vis.s = m.s || null; vis.vl = m.vl || 0; vis.vr = m.vr || 0; vis.at = performance.now(); break;
  }
}

// The words at the size they fit: from the full size down in small steps to 55 % of it; still
// too long, they wrap onto a second line at that size.
function fitText(id, full) {
  const e = $(id);
  e.classList.remove('wrap');
  let size = full;
  e.style.fontSize = size + 'vw';
  while (e.scrollWidth > e.clientWidth + 1 && size > full * 0.55) { size -= full * 0.05; e.style.fontSize = size + 'vw'; }
  if (e.scrollWidth > e.clientWidth + 1) e.classList.add('wrap');
}
function fitWords() { fitText('title', 3.1); fitText('artist', 1.9); }
window.addEventListener('resize', fitWords);

function badge() { $('badge').classList.toggle('hidden', !opt('logo', true) || !$('badge').dataset.has); }

function state(m) {
  const fresh = !st || st.key !== m.key;
  st = m; at = performance.now(); opts = m.opts || {};
  $('idle').classList.add('hidden'); $('stage').classList.remove('hidden');
  document.documentElement.style.setProperty('--tint', m.tint || '#7a9cff');
  document.documentElement.style.setProperty('--sung', m.sung || '#fff');
  const from = opt('from', true) ? (m.from || '') : '';
  if (fresh && shownKey !== null) {
    // A new track: the words step out and the new ones rise in (the cover does its own).
    ['from', 'title', 'artist'].forEach(id => $(id).classList.add('out'));
    setTimeout(() => {
      $('from').textContent = from; $('title').textContent = m.title || ''; $('artist').textContent = m.artist || '';
      fitWords(); layout();   // the title's height changed: the grid follows it
      ['from', 'title', 'artist'].forEach(id => { const e = $(id); e.classList.remove('out'); e.classList.add('pre'); void e.offsetWidth; e.classList.remove('pre'); });
    }, 280);
  } else {
    $('from').textContent = from; $('title').textContent = m.title || ''; $('artist').textContent = m.artist || '';
    fitWords();
  }
  shownKey = m.key;
  badge();
  $('strip').classList.toggle('gone', !opt('bar', true)); $('times').classList.toggle('gone', !opt('bar', true));
  $('clock').classList.toggle('hidden', !opt('clock', false));
  right();
  layout();
}

// ---- the cover: a new track's slides up and out while the new one rises from below (as the
// card's does); the same track's sharper picture simply takes its place.
function cover(m) {
  if (!m.art || m.art === artNow) return;
  const newTrack = m.key !== cover.key;
  cover.key = m.key; artNow = m.art;
  const img = new Image();
  img.onload = () => {
    const u = 'url("' + m.art + '")';
    if (!newTrack || !cover.shown) {
      $(covFront).style.backgroundImage = u; cover.shown = true;
    } else {
      const old = $(covFront), nw = $(covFront === 'covA' ? 'covB' : 'covA');
      nw.classList.remove('anim'); nw.style.backgroundImage = u;
      nw.style.transform = 'translateY(100%)';
      void nw.offsetWidth;
      nw.classList.add('anim'); old.classList.add('anim');
      nw.style.transform = 'translateY(0)';
      old.style.transform = 'translateY(-100%)';
      covFront = nw.id;
    }
    backdrop(m.art);
  };
  img.onerror = () => { $(covFront).style.backgroundImage = 'url("' + m.art + '")'; backdrop(m.art); };
  img.src = m.art;
}

// ---- the right side: lyrics, the list, or the artist
function right() {
  if (!st) return;
  const r = opt('right', 0);
  const lines = linesMsg && linesMsg.key === st.key ? linesMsg.lines : null;
  const hasLyrics = !!(lines && lines.length);
  const hasArtist = !!(artistMsg && artistMsg.name && (artistMsg.bio || artistMsg.pic));
  // 0 auto: the lyrics, else the list when it has something, else the artist; 1 the lyrics; 2 the
  // list; 3 the artist (else the list). The empty list says why rather than standing blank.
  const hasList = !!(listMsg && listMsg.items && listMsg.items.length);
  let show = 'none';
  if (r === 1) show = hasLyrics ? 'lyrics' : 'none';
  else if (r === 2) show = 'list';
  else if (r === 3) show = hasArtist ? 'artist' : 'list';
  else show = hasLyrics ? 'lyrics' : hasList ? 'list' : hasArtist ? 'artist' : 'list';
  const sig = show + '|' + (show === 'lyrics' ? st.key + JSON.stringify(lines).length : '')
    + '|' + (show === 'list' ? JSON.stringify(listMsg) + opt('grid', false) : '') + '|' + (show === 'artist' ? artistMsg.name : '');
  if (sig === rightSig) return;
  rightSig = sig;
  $('lyr').classList.toggle('hidden', show !== 'lyrics');
  $('list').classList.toggle('hidden', show !== 'list');
  $('art').classList.toggle('hidden', show !== 'artist');
  if (show === 'lyrics') { buildLines(lines); cur = -2; }
  if (show === 'list') buildList();
  if (show === 'artist') buildArtist();
  // what comes in fades in
  const el = show === 'lyrics' ? $('lyr') : show === 'list' ? $('list') : show === 'artist' ? $('art') : null;
  if (el) { el.classList.add('faded'); void el.offsetWidth; el.classList.remove('faded'); }
  layout();
}

function buildLines(lines) {
  const box = $('lines'); box.innerHTML = ''; rows = [];
  rows = lines.map((l, i) => {
    const d = document.createElement('div'); d.className = 'line';
    const end = i + 1 < lines.length ? lines[i + 1].t : l.t + 6000;
    const words = wordsOf(l, end);
    if (!words.length) d.textContent = l.x || ' ';
    words.forEach((w, k) => {
      if (k > 0 && w.space) d.appendChild(document.createTextNode(' '));
      const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w.x; d.appendChild(sp);
      w.el = sp;
    });
    if (l.r) { const ro = document.createElement('span'); ro.className = 'rom'; ro.textContent = l.r; d.appendChild(ro); }
    box.appendChild(d);
    return words;
  });
}

// A line's words, each with the time it is sung from and to -- the word times when the lyrics
// carry them, else the line's time shared by the words' lengths (up to the next line, but not
// slower than a plain singing pace). The same sums as the full screen on the PC.
let rows = [];
function wordsOf(l, end) {
  const out = [], timed = l.w;
  if (timed && timed.length && timed[0].t >= l.t - 2000 && timed[0].t <= end) {
    for (let i = 0; i < timed.length; i++) {
      const t = timed[i].x || '';
      if (!t.trim()) continue;   // an end mark
      const to = i + 1 < timed.length ? timed[i + 1].t : Math.min(end, timed[i].t + 700);
      out.push({ x: t.trim(), from: timed[i].t, to: Math.max(timed[i].t + 1, to), space: /^\s/.test(t) || out.length > 0 && /\s$/.test(timed[i - 1].x || '') });
    }
    return out;
  }
  const words = (l.x || '').split(' ').filter(w => w.length);
  const natural = (l.x || '').length * 70 + 400;
  const span = Math.max(400, Math.min((end - l.t) * 0.85, natural * 1.2));
  const total = words.reduce((n, w) => n + w.length + 2, 0);
  let at = 0;
  words.forEach(w => { const w0 = at; at += w.length + 2; out.push({ x: w, from: l.t + span * w0 / total, to: l.t + span * at / total, space: true }); });
  return out;
}

// The list: up next, or the playing playlist (its playing one ringed), as rows or a grid.
function buildList() {
  const box = $('items'); box.innerHTML = '';
  const m = listMsg || { mode: 0, at: -1, items: [] };
  const grid = opt('grid', false);
  $('listCap').textContent = m.mode === 1 ? 'PLAYLIST' : 'UP NEXT';
  box.className = grid ? 'grid' : '';
  if (!grid) { box.style.gridTemplateColumns = ''; }
  let items = m.items || [], from = 0;
  if (!grid) from = m.mode === 1 ? Math.max(0, m.at - 1) : 0;
  const count = grid ? 24 : 7;
  if (grid && m.mode === 1 && m.at >= 0) from = Math.max(0, Math.min(items.length - gridCols * 3, Math.floor(m.at / gridCols) * gridCols - gridCols));
  items.slice(from, from + count).forEach((n, k) => {
    const i = from + k, d = document.createElement('div');
    d.className = (grid ? 'cell' : 'nx') + (m.mode === 1 && i === m.at ? ' now' : '');
    d.innerHTML = '<div class="a"></div><div class="t"><b></b><span></span></div>';
    if (n.art) d.querySelector('.a').style.backgroundImage = 'url("' + n.art + '")';
    d.querySelector('b').textContent = n.title || ''; d.querySelector('span').textContent = n.artist || '';
    box.appendChild(d);
  });
  if (!items.length) {
    const d = document.createElement('div'); d.className = 'empty';
    d.textContent = (appNow === 'TIDAL' ? 'TIDAL shows what comes next only while its queue is open. ' : '') + 'Nothing coming up that the player shows yet.';
    box.appendChild(d);
  }
}

function buildArtist() {
  const a = artistMsg, e = $('art');
  e.querySelector('.pic').style.backgroundImage = a.pic ? 'url("' + a.pic + '")' : '';
  e.querySelector('.pic').classList.toggle('hidden', !a.pic);
  e.querySelector('.name').textContent = a.name || '';
  e.querySelector('.facts').textContent = a.facts || '';
  e.querySelector('.tags').textContent = (a.tags || '') + (a.listeners ? (a.tags ? '  ·  ' : '') + big(a.listeners) + ' listeners' : '');

  }
}

function tick(now) {
  requestAnimationFrame(tick);
  drift(now || performance.now());
  if (!st) return;
  const pos = Math.min(st.len || 0, st.pos + (st.playing ? performance.now() - at : 0));
  drawStrip(pos);
  $('el').textContent = fmt(pos); $('left_').textContent = '−' + fmt((st.len || 0) - pos);
  // Up next in the corner: the last 20 s, while the lyrics show and something is coming.
  const lyricsShow = !$('lyr').classList.contains('hidden');
  const n0 = nextItem();
  $('corner').classList.toggle('on', !!(opt('corner', true) && lyricsShow && n0 && st.len && st.len - pos < 20000 && st.len - pos > 500));
  if (!lyricsShow || !rows.length || !linesMsg) return;
  const lines = linesMsg.lines;
  let i = -1;
  for (let k = 0; k < lines.length; k++) if (lines[k].t <= pos + 250) i = k; else break;
  // The sweep through the sung line's words, 250 ms ahead as the lines are.
  if (i >= 0 && rows[i]) rows[i].forEach(w => {
    const p = Math.max(0, Math.min(1, (pos + 250 - w.from) / (w.to - w.from)));
    if (w.p !== p) { w.p = p; w.el.style.setProperty('--p', (p * 108) + '%'); }
  });
  if (i === cur) return;
  cur = i;
  const box = $('lines'), kids = box.children;
  for (let k = 0; k < kids.length; k++) kids[k].className = 'line' + (k === i ? ' now' : Math.abs(k - i) === 1 ? ' near' : '');
  const el = kids[Math.max(0, i)];
  const y = el ? el.offsetTop - $('lyr').clientHeight / 3 : 0;
  box.style.transform = 'translateY(' + (-Math.max(0, y)) + 'px)';
}
requestAnimationFrame(tick);

function clock() {
  const d = new Date();
  $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
clock(); setInterval(clock, 5000);

const context = cast.framework.CastReceiverContext.getInstance();
let told = false;
context.addCustomMessageListener(NS, e => {
  try { onMessage(typeof e.data === 'string' ? JSON.parse(e.data) : e.data); } catch (x) { console.log(x); }
  // The first message from the PC is answered with what this screen measures.
  if (!told) { told = true; try { context.sendCustomMessage(NS, e.senderId, measures()); } catch (x) { console.log(x); } }
});
const options = new cast.framework.CastReceiverOptions();
options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
options.disableIdleTimeout = true;   // a now-playing screen: it stays while the PC talks to it
options.skipPlayersLoad = true;      // no media player of its own
context.start(options);

// Staying awake. Google TV puts its screensaver over an app that plays no media after a few
// minutes without the remote -- and this page plays none. So: the Screen Wake Lock, and a tiny
// muted video (a canvas stream, a pixel's worth of change a second) playing in a corner, which is
// what the TV looks for. Which of the two took is told to the PC with the measures.
let awakeHow = [];
async function stayAwake() {
  awakeHow = [];
  try {
    if (navigator.wakeLock) { await navigator.wakeLock.request('screen'); awakeHow.push('wake lock'); }
    else awakeHow.push('no wake lock API');
  } catch (x) { awakeHow.push('wake lock refused (' + x.name + ')'); }
  try {
    let v = document.getElementById('awake');
    if (!v) {
      const c = document.createElement('canvas'); c.width = c.height = 16;
      const g = c.getContext('2d'); let n = 0;
      setInterval(() => { g.fillStyle = (n++ & 1) ? '#070708' : '#08070a'; g.fillRect(0, 0, 16, 16); }, 1000);
      v = document.createElement('video'); v.id = 'awake';
      v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
      v.style.cssText = 'position:fixed;right:0;bottom:0;width:16px;height:16px;opacity:0.02;pointer-events:none';
      v.srcObject = c.captureStream(1);
      document.body.appendChild(v);
    }
    await v.play();
    awakeHow.push('video playing');
  } catch (x) { awakeHow.push('video refused (' + x.name + ')'); }
}
stayAwake();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') stayAwake(); });

// What this screen really is (a Google TV Streamer drew us on ~80 % of it): told to the PC, which logs it.
function measures() {
  const vv = window.visualViewport;
  return { type: 'info', iw: innerWidth, ih: innerHeight, cw: document.documentElement.clientWidth,
    ch: document.documentElement.clientHeight, sw: screen.width, sh: screen.height, aw: screen.availWidth,
    ah: screen.availHeight, dpr: devicePixelRatio, vs: vv ? vv.scale : null, vw: vv ? vv.width : null,
    ua: navigator.userAgent, awake: awakeHow.join(', ') };
}
// And if the screen still shows more than the page was laid out for (the visual viewport wider
// than the layout one), the whole page is scaled up from the top-left corner to fill it.
function fill() {
  const vv = window.visualViewport, de = document.documentElement;
  if (!vv || !de.clientWidth) return;
  const k = Math.min(vv.width / de.clientWidth, vv.height / de.clientHeight);
  document.body.style.transformOrigin = '0 0';
  document.body.style.transform = Math.abs(k - 1) > 0.02 ? 'scale(' + k + ')' : '';
}
fill();
if (window.visualViewport) window.visualViewport.addEventListener('resize', fill);
window.addEventListener('resize', fill);
</script>
